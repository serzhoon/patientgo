<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МедЗапись</title>
   <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e9488'/%3E%3Crect x='42' y='22' width='16' height='56' rx='3' fill='%23fff'/%3E%3Crect x='22' y='42' width='56' height='16' rx='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="brand">МедЗапись<span> · поликлиника</span></div>
    <nav>
      <span id="userInfo"></span>
      <button id="logoutBtn" class="btn-logout hidden">Выйти</button>
    </nav>
  </header>

  <div class="container">

    <!-- ====== Блок входа / регистрации (виден, пока не вошли) ====== -->
    <div id="authSection" class="card" style="max-width:420px; margin:40px auto;">
      <div class="tabs">
        <button id="tabLogin" class="active">Вход</button>
        <button id="tabRegister">Регистрация</button>
      </div>

      <!-- Форма входа -->
      <div id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.ru">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button class="btn-primary" id="loginBtn">Войти</button>
        <div class="forgot-link"><a href="#" id="forgotLink">Забыли пароль?</a></div>
        <div class="divider">или</div>
        <button class="btn-gosuslugi" id="gosuslugiBtn">Войти через Госуслуги</button>
        <div id="loginMsg" class="message"></div>
      </div>

      <!-- Форма регистрации -->
      <div id="registerForm" class="hidden">
        <label for="regLastName">Фамилия <span class="req">*</span></label>
        <input type="text" id="regLastName" placeholder="Иванов">
        <label for="regFirstName">Имя <span class="req">*</span></label>
        <input type="text" id="regFirstName" placeholder="Иван">
        <label for="regMiddleName">Отчество</label>
        <input type="text" id="regMiddleName" placeholder="Иванович">
        <label for="regBirthDate">Дата рождения <span class="req">*</span></label>
        <input type="date" id="regBirthDate">
        <label for="regCity">Город <span class="req">*</span></label>
        <select id="regCity"></select>
        <label for="regClinic">Поликлиника <span class="req">*</span></label>
        <select id="regClinic"></select>
        <label for="regEmail">Email <span class="req">*</span></label>
        <input type="email" id="regEmail" placeholder="you@example.ru">
        <label for="regPhone">Телефон <span class="req">*</span></label>
        <input type="text" id="regPhone" placeholder="+7 (___) ___-__-__">
        <label for="regPassword">Пароль <span class="req">*</span></label>
        <input type="password" id="regPassword" placeholder="придумайте пароль">

        <label class="consent">
          <input type="checkbox" id="regConsent">
          <span>Я даю согласие на обработку персональных данных в соответствии с требованиями №152-ФЗ от 27.07.2006.</span>
        </label>

        <p class="req-note"><span class="req">*</span> — поля, обязательные для заполнения</p>
        <p class="mfc-note">Внимание: после регистрации изменить персональные данные можно только при обращении в МФЦ.</p>
        <button class="btn-primary" id="registerBtn">Зарегистрироваться</button>
        <div id="registerMsg" class="message"></div>
        </div>
      </div>

    <!-- ====== Блок приложения (виден после входа) ====== -->
    <div id="appSection" class="hidden">

      <!-- Запись на приём — только для пациентов -->
      <div id="bookingCard" class="card">
        <h2>Записаться на приём</h2>
        <label for="doctorSelect">Врач</label>
        <select id="doctorSelect"></select>
        <label for="appdate">Дата</label>
        <input type="date" id="appdate">
          <label for="apptime">Время</label>
        <select id="apptime">
          <option value="">Сначала выберите врача и дату</option>
        </select>
        <label for="comment">Жалоба / комментарий (необязательно)</label>
        <textarea id="comment" placeholder="Например: головная боль третий день"></textarea>
        <button class="btn-primary" id="bookBtn">Записаться</button>
        <div id="bookMsg" class="message"></div>
      </div>

      <!-- Список записей -->
      <div class="card">
        <h2 id="apptTitle">Мои записи</h2>
        <div id="apptList"></div>
      </div>

    </div>

  </div>
   <!-- Универсальное модальное окно (уведомления и подтверждения) -->
  <div id="uiModal" class="modal-overlay hidden">
    <div class="modal-window">
      <p id="uiModalText" style="margin-bottom:20px;font-size:15px;"></p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn-logout" id="uiModalCancel">Отмена</button>
        <button class="btn-primary" id="uiModalOk" style="width:auto;margin-top:0;">ОК</button>
      </div>
    </div>
  </div>
  <!-- Модальное окно "Забыли пароль"  -->
  <div id="forgotModal" class="modal-overlay hidden">
    <div class="modal-window">
      <button class="modal-close" id="forgotClose">&times;</button>
      <h2>Восстановление пароля</h2>
      <p style="color:var(--muted); font-size:14px; margin-bottom:8px;">
        Введите email, привязанный к аккаунту.
      </p>
      <label for="forgotInput">email</label>
      <input type="text" id="forgotInput" placeholder="you@example.ru">
      <button class="btn-primary" id="forgotSubmit">Восстановить</button>
      <div id="forgotMsg" class="message"></div>
    </div>
  </div>
  <!-- Сначала конфиг (адрес API), потом логика -->
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
